# 首次部署：复制本文件为 wrangler.toml（该文件不入库，含自动回写的资源 ID）
#   cp wrangler.toml.example wrangler.toml
# name 为 Worker 名称，全账号唯一，按需修改
name = "cron-day-report"
main = "src/index.js"
compatibility_date = "2024-01-01"

[triggers]
# 每小时触发一次（UTC）。具体"几点/几号推送"由数据库 push_config 决定，
# Worker 每次唤醒读配置用 shouldRun 判断是否到点，实现画面可配、平台无关。
crons = ["0 * * * *"]

# D1 数据库绑定：已有部署必须保留真实 database_id（无 ID 部署会自动新建空库）
[[d1_databases]]
binding = "DB"
database_name = "cron_db"

# KV 命名空间绑定：已有部署必须保留真实 id（无 ID 部署会自动新建空 namespace）
[[kv_namespaces]]
binding = "KV"

# ==================== 运行时变量 / 密钥（不写入本文件） ====================
# 1) STORAGE_DRIVER —— 存储驱动，默认 d1（src/storage/adapter.js 兜底），通常无需配置。
#    生产：Dashboard → 本 Worker → Settings → Variables and Secrets 添加 Variable；
#    本地：复制 .dev.vars.example 为 .dev.vars 填写（仅 wrangler dev 生效，不入库）。
# 2) PUBLIC_BASE_URL —— 站点公开地址（日报内免密链接拼接用）。
#    推荐：超管在「系统设置 → 站点公开地址」配置（DB 值优先级最高，换域名免重新部署）；
#    也可在上述 Dashboard Variables 配置；都不配时以请求域名兜底。
# 3) ADMIN_BOOTSTRAP_TOKEN（初始超管创建）、CRON_SECRET（/cron 手动触发保护）属密钥：
#    Dashboard Variables and Secrets 中类型选 Secret（加密），或 wrangler secret put <名称>；
#    切勿写入本文件。
